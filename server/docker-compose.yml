services:
  session-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SESSION_API_TOKEN: ${SESSION_API_TOKEN:-}
      GAMES_DIRECTORY: /private/games
      SAVES_DIRECTORY: /private/saves
      SESSIONS_DIRECTORY: /private/sessions
    volumes:
      - ./games-private:/private/games:ro
      - ./bios-private:/private/bios:ro
      - ./saves-private:/private/saves
      - ./sessions:/private/sessions
    restart: unless-stopped
